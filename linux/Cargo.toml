[package]
name = "sunrise-linux"
version = "0.5.6"
edition = "2021"
authors = ["UberMetroid <https://github.com/UberMetroid>"]
description = "Project Sunrise Linux runtime, emulation server, and test harness"
license = "GPL-3.0-or-later"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
aes-gcm = "0.10"
hmac = "0.12"
ratatui = "0.28"
crossterm = "0.28"

[[bin]]
name = "sunrise-linux"
path = "src/main.rs"

[lib]
name = "sunrise_linux"
path = "src/lib.rs"
