<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cyanArc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Circular Plate -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="#334155" stroke-width="6"/>
  <circle cx="256" cy="256" r="226" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Outer Geometric Ghost Wings (Top/Bottom/Left/Right) -->
  <!-- Top Horn -->
  <polygon points="256,48 296,160 216,160" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="256,48 256,160 216,160" fill="#cbd5e1"/>

  <!-- Bottom Horn -->
  <polygon points="256,464 216,352 296,352" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="256,464 256,352 296,352" fill="#cbd5e1"/>

  <!-- Left Wing -->
  <polygon points="48,256 160,216 160,296" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="48,256 160,256 160,296" fill="#cbd5e1"/>

  <!-- Right Wing -->
  <polygon points="464,256 352,296 352,216" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="464,256 352,256 352,216" fill="#cbd5e1"/>

  <!-- Diagonal Facets -->
  <!-- Top-Left -->
  <polygon points="120,120 200,168 168,200" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <!-- Top-Right -->
  <polygon points="392,120 344,200 312,168" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <!-- Bottom-Left -->
  <polygon points="120,392 168,312 200,344" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <!-- Bottom-Right -->
  <polygon points="392,392 312,344 344,312" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>

  <!-- Central Core Housing -->
  <circle cx="256" cy="256" r="76" fill="#0f172a" stroke="url(#goldGlow)" stroke-width="8" filter="url(#glow)"/>

  <!-- Ghost Glowing Eye -->
  <circle cx="256" cy="256" r="46" fill="url(#cyanArc)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="28" fill="#38bdf8"/>
  <circle cx="256" cy="256" r="14" fill="#ffffff"/>

  <!-- Sunrise Horizon Ring -->
  <circle cx="256" cy="256" r="62" fill="none" stroke="url(#goldGlow)" stroke-width="3" opacity="0.8"/>
</svg>
