[package]
name = "thanatonaut"
version = "0.6.3"
edition = "2021"
authors = ["UberMetroid <https://github.com/UberMetroid>"]
description = "Thanatonaut — Private Destiny 2 emulation server fork of Project Sunrise"
license = "GPL-3.0-or-later"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
aes-gcm = "0.10"
hmac = "0.12"
ratatui = "0.28"
crossterm = "0.28"

[[bin]]
name = "thanatonaut"
path = "src/main.rs"

[lib]
name = "thanatonaut"
path = "src/lib.rs"